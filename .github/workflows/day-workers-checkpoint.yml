name: Day workers authenticated browser and SQL
on:
  push:
    branches: [16-greenhouse-daily-day-workers, 01-architecture-database]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: day-workers-checkpoint-${{ github.ref }}
  cancel-in-progress: false
jobs:
  day-workers-browser-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      R3_CONNECTED_PILOT: '1'
      R3_DAILY_PILOT: '1'
      PILOT_LOCAL_TEST: '1'
      PREVIEW_BIND: 127.0.0.1
      PREVIEW_PORT: '4173'
      PREVIEW_URL: http://127.0.0.1:4173
      DAY_WORKERS_PHASE: full
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record exact clean checkout
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test -z "$(git status --porcelain)"
          echo "OWNER_PREVIEW_FEATURE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          mkdir -p artifacts/r3-connected artifacts/day-workers
          git rev-parse HEAD > artifacts/day-workers/checkout-sha.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing TEST dependencies
        run: |
          pip install -e '.[dev]'
          npm ci
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-tur poppler-utils
          npx playwright install --with-deps chromium webkit
      - name: Expiring synthetic participants outside evidence
        run: |
          echo "PILOT_EXPIRES_AT=$(python -c 'from datetime import datetime,timedelta,timezone;print((datetime.now(timezone.utc)+timedelta(hours=4)).isoformat())')" >> "$GITHUB_ENV"
          echo "PILOT_E2E_CREDENTIALS=$RUNNER_TEMP/pilot-private-credentials.json" >> "$GITHUB_ENV"
          echo "PILOT_PROVISION_SCRIPT=$GITHUB_WORKSPACE/scripts/private_daily_pilot_provision.py" >> "$GITHUB_ENV"
      - name: Start isolated authenticated loopback TEST
        run: |
          bash scripts/start_r3_connected_ci.sh
          export TEST_DATABASE_URL='postgresql+psycopg://postgres@127.0.0.1:5432/greenhouse_owner_os_test'
          python scripts/private_daily_pilot_sql_evidence.py --prepare artifacts/day-workers --credentials "$PILOT_E2E_CREDENTIALS"
      - name: Actual owner and worker journeys with SQL evidence
        run: |
          set -euo pipefail
          for engine in chromium webkit; do
            export DAY_WORKERS_ENGINE="$engine"
            export E2E_ARTIFACTS="artifacts/day-workers/$engine"
            mkdir -p "$E2E_ARTIFACTS"
            python scripts/private_daily_pilot_provision.py --reset-fixture-rate-limits
            python scripts/day_workers_sql_evidence.py --prepare --credentials "$PILOT_E2E_CREDENTIALS" --output "$E2E_ARTIFACTS/setup.json"
            python scripts/day_workers_sql_evidence.py --before "$E2E_ARTIFACTS/before.json"
            node tests/e2e/day-workers.mjs
            python scripts/day_workers_sql_evidence.py --verify "$E2E_ARTIFACTS/browser.json" --baseline "$E2E_ARTIFACTS/before.json" --output "$E2E_ARTIFACTS/sql.json"
          done
      - name: Connected task audience clarification and immutable recovery
        run: |
          set -euo pipefail
          for engine in chromium webkit; do
            export TASK_AUDIENCE_ENGINE="$engine"
            export E2E_ARTIFACTS="artifacts/task-audience/$engine"
            mkdir -p "$E2E_ARTIFACTS"
            python scripts/private_daily_pilot_provision.py --reset-fixture-rate-limits
            python scripts/task_audience_sql_evidence.py --prepare --credentials "$PILOT_E2E_CREDENTIALS" --output "$E2E_ARTIFACTS/setup.json"
            python scripts/task_audience_sql_evidence.py --before "$E2E_ARTIFACTS/before.json"
            node tests/e2e/task-audience.mjs
            python scripts/task_audience_sql_evidence.py --verify "$E2E_ARTIFACTS/browser.json" --baseline "$E2E_ARTIFACTS/before.json" --output "$E2E_ARTIFACTS/sql.json"
          done
      - name: Preserve owned diagnostics
        if: always()
        run: |
          mkdir -p artifacts/day-workers/runtime
          if [ -f "$RUNNER_TEMP/r3-connected-server.log" ]; then cp "$RUNNER_TEMP/r3-connected-server.log" artifacts/day-workers/runtime/server.log; fi
          if [ -n "${R3_PILOT_CONTAINER:-}" ]; then docker logs "$R3_PILOT_CONTAINER" > artifacts/day-workers/runtime/postgres.log 2>&1 || true; fi
      - name: Guard private evidence
        id: guard
        if: always()
        run: python scripts/private_daily_pilot_artifact_guard.py artifacts
      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outcome == 'success'
        with:
          name: day-workers-${{ github.sha }}
          path: |
            artifacts/day-workers/
            artifacts/task-audience/
          retention-days: 14
          if-no-files-found: error
      - name: Stop only owned TEST runtime
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/r3-connected-server.pid" ]; then kill "$(cat "$RUNNER_TEMP/r3-connected-server.pid")" || true; fi
          if [ -n "${R3_PILOT_CONTAINER:-}" ]; then docker stop "$R3_PILOT_CONTAINER" || true; docker rm -v "$R3_PILOT_CONTAINER" || true; fi
