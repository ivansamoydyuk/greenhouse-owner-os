[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "greenhouse-owner-os"
version = "0.1.0"
description = "Greenhouse Owner OS owner-first finance core"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.128,<1",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0.50,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.34,<1",
  "Pillow>=12,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "PyYAML>=6,<7",
  "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
greenhouse_owner_os = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
