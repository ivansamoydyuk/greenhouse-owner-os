components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    FinanceOverview:
      type: object
      description: Additive direct-expense read projection. Existing Finance balances,
        operation families, offset/limit/has_more pagination and other response fields
        remain unchanged. The direct-expense list is independently bounded and is
        not used to recompute balances.
      additionalProperties: true
      required:
      - direct_expenses
      - direct_expenses_total
      - direct_expenses_limit
      - direct_expenses_has_more
      - direct_expenses_order
      - direct_expenses_period
      properties:
        direct_expenses:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/DirectExpenseRead'
          description: Most recent posted or reversed direct-expense records across
            all dates and currencies, ordered by created_at descending then id descending.
            Never a period total or full history.
        direct_expenses_total:
          type: integer
          minimum: 0
          description: Total number of direct-expense rows for this entity, including
            reversed rows. This is a row count, not a monetary total.
        direct_expenses_limit:
          type: integer
          const: 50
        direct_expenses_has_more:
          type: boolean
          description: True when rows exist beyond the bounded recent list.
        direct_expenses_order:
          type: string
          const: created_at_desc_id_desc
        direct_expenses_period:
          type: string
          const: ALL_DATES
    DirectExpenseRead:
      type: object
      additionalProperties: false
      required:
      - id
      - entity_id
      - proposal_id
      - amount
      - currency
      - event_date
      - money_account_id
      - counterparty_id
      - description
      - status
      - version
      - posting_id
      - reversal_posting_id
      - created_by
      - created_at
      - reversed_by
      - reversal_reason
      - source_id
      properties:
        id:
          type: string
          format: uuid
        entity_id:
          type: string
          format: uuid
        proposal_id:
          type: string
          format: uuid
        amount:
          type: string
          pattern: ^\d+\.\d{2}$
        currency:
          type: string
          minLength: 3
          maxLength: 3
        event_date:
          type: string
          format: date
        money_account_id:
          type: string
          format: uuid
        counterparty_id:
          type:
          - string
          - 'null'
          format: uuid
        description:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - posted
          - reversed
        version:
          type: integer
          minimum: 1
        posting_id:
          type: string
          format: uuid
        reversal_posting_id:
          type:
          - string
          - 'null'
          format: uuid
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        reversed_by:
          type:
          - string
          - 'null'
          format: uuid
        reversal_reason:
          type:
          - string
          - 'null'
        source_id:
          type: string
          format: uuid
          description: Persisted original inbox identity joined through the same-entity
            proposal; summary includes no original bytes or raw text.
    HarvestEvidenceMetadata:
      properties:
        structured_original:
          anyOf:
          - $ref: '#/components/schemas/OwnerFormSource'
          - type: 'null'
        id:
          type: string
          format: uuid
          title: Id
        entity_id:
          type: string
          format: uuid
          title: Entity Id
        source:
          type: string
          title: Source
        source_reference:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Reference
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
          description: Exact immutable original text or source-associated caption;
            never synthesized from prepared report fields.
        filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
        mime_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Mime Type
        fingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Fingerprint
        created_by:
          type: string
          format: uuid
          title: Created By
        received_at:
          type: string
          format: date-time
          title: Received At
        has_file:
          type: boolean
          title: Has File
        original_url:
          anyOf:
          - type: string
          - type: 'null'
          format: uri-reference
          title: Original Url
          description: Same-origin existing /v1/entities/{entity_id}/harvest/evidence/{evidence_id}
            binary route when has_file is true; otherwise null. Never a source-provided
            URL.
      additionalProperties: false
      type: object
      required:
      - id
      - entity_id
      - source
      - source_reference
      - raw_text
      - filename
      - mime_type
      - fingerprint
      - created_by
      - received_at
      - has_file
      - original_url
      title: HarvestEvidenceMetadata
    Money:
      type: string
      pattern: ^-?[0-9]+\\.[0-9]{2}$
      examples:
      - '10000.00'
    ObligationCreate:
      type: object
      additionalProperties: false
      required:
