  /payments/{id}/post:
    post:
      operationId: postPayment
      summary: Lock referenced obligations; validate and post payment, allocations,
        advance remainder and balanced posting in one transaction
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: expected_version
