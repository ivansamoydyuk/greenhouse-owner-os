      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReversalRequest'
      responses:
        '200':
          description: Reversed; actor, timestamp, reason and original/reversal/replacement
            linkage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionLinkage'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '404':
          $ref: '#/components/responses/NotFound'
  /payments/{id}/linkage:
