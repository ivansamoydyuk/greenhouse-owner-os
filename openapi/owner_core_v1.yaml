openapi: 3.1.0
info:
  title: Greenhouse Owner OS — Owner Core API
  version: 0.1.0
  description: API contract for the first finance vertical slice. Financial amounts
    are JSON strings in responses and decimals in requests; clients must not use binary
    floating point for calculations.
servers:
- url: /v1
paths:
  /obligations:
    post:
      operationId: createObligationDraft
      summary: Create obligation draft; no financial effect
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObligationCreate'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obligation'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
  /obligations/{id}:
    get:
      operationId: getObligation
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Obligation with derived remaining amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obligation'
        '404':
          $ref: '#/components/responses/NotFound'
  /obligations/{id}/post:
    post:
      operationId: postObligation
      summary: Post obligation and immutable balanced posting atomically
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: expected_version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obligation'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
  /payments:
    post:
      operationId: createPaymentDraft
      summary: Create settlement payment draft and proposed allocations; no financial
        effect
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
  /payments/{id}/post:
    post:
      operationId: postPayment
      summary: Lock referenced obligations; validate and post payment, allocations,
        advance remainder and balanced posting in one transaction
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: expected_version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
  /payments/{id}/reverse:
    post:
      operationId: reversePayment
      summary: Reverse posted transaction atomically; preserve original history
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReversalRequest'
      responses:
        '200':
          description: Reversed; actor, timestamp, reason and original/reversal/replacement
            linkage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionLinkage'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '404':
          $ref: '#/components/responses/NotFound'
  /payments/{id}/linkage:
