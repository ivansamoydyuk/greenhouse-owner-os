openapi: 3.1.0
info:
  title: Greenhouse Owner OS — Owner Core API
  version: 0.1.0
  description: API contract for the first finance vertical slice. Financial amounts
    are JSON strings in responses and decimals in requests; clients must not use binary
    floating point for calculations.
servers:
- url: /v1
paths:
  /entities/{entity_id}/finance/analytics:
    get:
      summary: Analytics
      operationId: analytics_v1_entities__entity_id__finance_analytics_get
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Entity Id
      - name: date_from
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Date From
      - name: date_to
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Date To
      - name: currency
        in: query
        required: false
        schema:
          type: string
          default: TRY
          title: Currency
      - name: greenhouse_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Greenhouse Id
      - name: money_account_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Money Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceAnalytics'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /entities/{entity_id}/finance/analytics/documents/{obligation_id}:
    get:
      summary: Document
      operationId: document_v1_entities__entity_id__finance_analytics_documents__obligation_id__get
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Entity Id
      - name: obligation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Obligation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtDocument'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /entities/{entity_id}/finance-overview:
