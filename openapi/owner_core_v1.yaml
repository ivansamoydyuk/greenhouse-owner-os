components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Money:
      type: string
      pattern: ^-?[0-9]+\\.[0-9]{2}$
      examples:
      - '10000.00'
    ObligationCreate:
      type: object
      additionalProperties: false
      required:
      - entity_id
      - counterparty_id
      - direction
      - original_amount
      - currency
      - event_date
      - offset_ledger_account_id
      properties:
        entity_id:
          type: string
          format: uuid
        counterparty_id:
          type: string
          format: uuid
        direction:
          type: string
          enum:
          - payable
          - receivable
        original_amount:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        event_date:
          type: string
          format: date
        due_date:
          type:
          - string
          - 'null'
          format: date
        offset_ledger_account_id:
          type: string
          format: uuid
        replacement_of_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Optional unique reversed original of same type, entity, counterparty,
            currency and direction
        obligation_class: &id001
          type: string
          enum:
          - OPERATIONAL
          - STRATEGIC
          title: Obligation Class
          default: OPERATIONAL
        economic_source: &id002
          type: string
          enum:
          - manual_other
          - harvest_depot
          title: Economic Source
          default: manual_other
        description: &id003
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Description
        attributions: &id004
          items:
            $ref: '#/components/schemas/AttributionInput'
          type: array
          title: Attributions
          default: []
    Obligation:
      type: object
      required:
      - id
      - direction
      - original_amount
      - remaining_amount
      - currency
      - status
      - version
      properties:
        id:
          type: string
          format: uuid
        direction:
          type: string
          enum:
          - payable
          - receivable
        original_amount:
          $ref: '#/components/schemas/Money'
        remaining_amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        status:
          type: string
          enum:
          - draft
          - review
          - posted
          - reversed
        version:
          type: integer
        posting_id:
          type:
          - string
          - 'null'
          format: uuid
        obligation_class: *id001
        economic_source: *id002
        description: *id003
        attributions: *id004
    Allocation:
      type: object
      additionalProperties: false
      required:
      - obligation_id
      - amount
      properties:
        obligation_id:
          type: string
          format: uuid
        amount:
          type: number
          exclusiveMinimum: 0
    PaymentCreate:
      type: object
      additionalProperties: false
      required:
      - entity_id
      - money_account_id
      - counterparty_id
      - direction
      - amount
      - currency
      - event_date
      properties:
        entity_id:
          type: string
          format: uuid
        money_account_id:
          type: string
          format: uuid
        counterparty_id:
          type: string
          format: uuid
        direction:
          type: string
          enum:
          - in
          - out
        amount:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        event_date:
          type: string
          format: date
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/Allocation'
        replacement_of_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Optional unique reversed original of same type, entity, counterparty,
            currency and direction
    Payment:
      type: object
      required:
      - id
      - direction
      - amount
      - currency
      - status
      - version
      - allocation_total
      - unallocated_amount
      - allocations
      properties:
        id:
          type: string
          format: uuid
        direction:
          type: string
          enum:
          - in
          - out
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        status:
          type: string
          enum:
          - draft
          - review
          - posted
          - reversed
        version:
          type: integer
        allocation_total:
          $ref: '#/components/schemas/Money'
        unallocated_amount:
          $ref: '#/components/schemas/Money'
