components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Money:
      type: string
      pattern: ^-?[0-9]+\\.[0-9]{2}$
      examples:
      - '10000.00'
    ObligationCreate:
      type: object
      additionalProperties: false
      required:
      - entity_id
      - counterparty_id
      - direction
      - original_amount
      - currency
      - event_date
      - offset_ledger_account_id
      properties:
        entity_id:
          type: string
          format: uuid
        counterparty_id:
          type: string
          format: uuid
        direction:
          type: string
          enum:
          - payable
          - receivable
        original_amount:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        event_date:
          type: string
          format: date
        due_date:
          type:
          - string
          - 'null'
          format: date
        offset_ledger_account_id:
          type: string
          format: uuid
        replacement_of_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Optional unique reversed original of same type, entity, counterparty,
            currency and direction
        obligation_class: &id001
          type: string
          enum:
          - OPERATIONAL
          - STRATEGIC
          title: Obligation Class
          default: OPERATIONAL
        economic_source: &id002
          type: string
          enum:
          - manual_other
          - harvest_depot
          title: Economic Source
          default: manual_other
        description: &id003
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Description
        attributions: &id004
          items:
            $ref: '#/components/schemas/AttributionInput'
          type: array
          title: Attributions
          default: []
    Obligation:
      type: object
      required:
      - id
      - direction
      - original_amount
      - remaining_amount
      - currency
      - status
      - version
      properties:
        id:
          type: string
          format: uuid
        direction:
          type: string
          enum:
          - payable
          - receivable
        original_amount:
          $ref: '#/components/schemas/Money'
        remaining_amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        status:
          type: string
          enum:
          - draft
          - review
          - posted
          - reversed
        version:
          type: integer
        posting_id:
          type:
          - string
          - 'null'
          format: uuid
        obligation_class: *id001
        economic_source: *id002
        description: *id003
        attributions: *id004
    Allocation:
      type: object
      additionalProperties: false
      required:
      - obligation_id
      - amount
      properties:
        obligation_id:
          type: string
          format: uuid
        amount:
          type: number
          exclusiveMinimum: 0
    PaymentCreate:
      type: object
      additionalProperties: false
      required:
      - entity_id
      - money_account_id
      - counterparty_id
      - direction
      - amount
      - currency
      - event_date
      properties:
        entity_id:
          type: string
          format: uuid
        money_account_id:
          type: string
          format: uuid
        counterparty_id:
          type: string
          format: uuid
        direction:
          type: string
          enum:
          - in
          - out
        amount:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        event_date:
          type: string
          format: date
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/Allocation'
        replacement_of_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Optional unique reversed original of same type, entity, counterparty,
            currency and direction
    Payment:
      type: object
      required:
      - id
      - direction
      - amount
      - currency
      - status
      - version
      - allocation_total
      - unallocated_amount
      - allocations
      properties:
        id:
          type: string
          format: uuid
        direction:
          type: string
          enum:
          - in
          - out
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        status:
          type: string
          enum:
          - draft
          - review
          - posted
          - reversed
        version:
          type: integer
        allocation_total:
          $ref: '#/components/schemas/Money'
        unallocated_amount:
          $ref: '#/components/schemas/Money'
        advance_id:
          type:
          - string
          - 'null'
          format: uuid
        allocations:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Allocation'
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
    ReversalRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - event_date
      - reason
      properties:
        expected_version:
          type: integer
          minimum: 1
        event_date:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    TransactionLinkage:
      type: object
      required:
      - id
      - type
      - status
      - version
      - currency
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - payment
          - obligation
        status:
          type: string
        version:
          type: integer
        currency:
          type: string
        original_posting_id:
          type:
          - string
          - 'null'
          format: uuid
        reversal_posting_id:
          type:
          - string
          - 'null'
          format: uuid
        replacement_of_id:
          type:
          - string
          - 'null'
          format: uuid
        replacement_id:
          type:
          - string
          - 'null'
          format: uuid
        reversed_by:
          type:
          - string
          - 'null'
          format: uuid
        reversed_at:
          type:
          - string
          - 'null'
          format: date-time
        reason:
          type:
          - string
          - 'null'
        obligation_balances:
          type: object
          additionalProperties:
            type: string
    AllocationBody:
      properties:
        obligation_id:
          type: string
          format: uuid
          title: Obligation Id
        amount:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Amount
      additionalProperties: false
      type: object
      required:
      - obligation_id
      - amount
      title: AllocationBody
    FundingCommand:
      properties:
        entity_id:
          type: string
          format: uuid
          title: Entity Id
        amount:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,18}|(?=[\d.]{1,21}0*$)\d{0,18}\.\d{0,2}0*$)
          title: Amount
        currency:
          type: string
          maxLength: 3
          minLength: 3
          title: Currency
        event_date:
          type: string
          format: date
          title: Event Date
        source:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Source
        reason:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Reason
        money_account_id:
          type: string
          format: uuid
          title: Money Account Id
      additionalProperties: false
      type: object
      required:
      - entity_id
      - amount
      - currency
      - event_date
      - money_account_id
      title: FundingCommand
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ObligationCreateBody:
      properties:
        obligation_class:
          type: string
          enum:
          - OPERATIONAL
          - STRATEGIC
          title: Obligation Class
          default: OPERATIONAL
        economic_source:
          type: string
          enum:
          - manual_other
          - harvest_depot
          title: Economic Source
          default: manual_other
        description:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Description
