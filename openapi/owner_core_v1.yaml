openapi: 3.1.0
info:
  title: Greenhouse Owner OS — Owner Core API
  version: 0.1.0
  description: API contract for the first finance vertical slice. Financial amounts
    are JSON strings in responses and decimals in requests; clients must not use binary
    floating point for calculations.
servers:
- url: /v1
paths:
  /entities/{entity_id}/finance-overview:
    get:
      summary: Finance Overview
      operationId: finance_overview_v1_entities__entity_id__finance_overview_get
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Entity Id
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /obligations:
    post:
      summary: Create Obligation
      operationId: create_obligation_v1_obligations_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObligationCreateBody'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /obligations/{id}:
    get:
      operationId: getObligation
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Obligation with derived remaining amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obligation'
        '404':
          $ref: '#/components/responses/NotFound'
  /obligations/{id}/post:
    post:
      operationId: postObligation
      summary: Post obligation and immutable balanced posting atomically
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: expected_version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obligation'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
  /payments:
    post:
      summary: Create Payment
      operationId: create_payment_v1_payments_post
      parameters:
      - name: Idempotency-Key
        in: header
