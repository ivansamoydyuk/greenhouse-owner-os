            application/json:
              schema:
                $ref: '#/components/schemas/Obligation'
        '404':
          $ref: '#/components/responses/NotFound'
  /obligations/{id}/post:
    post:
      operationId: postObligation
      summary: Post obligation and immutable balanced posting atomically
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: expected_version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obligation'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
